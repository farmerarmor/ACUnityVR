[VR]
NativeBaseline=0
EyeWidth=4000
EyeHeight=4768
RefreshHz=89.998

[Foveation]
; Accepted settings remain the default. Read at startup; restart for INI edits.
Enabled=1
Geometry=1
; Added exact lighting shaders PS49 and PS301..305; NumPad6 compares coverage.
ExtendedLighting=1
; 0=full rate, 1=2x1, 2=2x2 (tested default), 3=2x4 (stronger).
Strength=2
; Radius as a fraction of eye width/height; larger keeps more of the view sharp.
CentreRadius=0.35
; The accepted mask starts ON. F4 toggles it for the whole stereo pair.
HiddenAreaMask=1
; Keep this many extra pixels around the runtime visible region.
HiddenAreaMargin=64

[UI]
; Local HUD/menu panel; world-space markers retain the native eye camera.
Enabled=1
; Legacy common fallback; separate values below take precedence.
WidthDegrees=80
; HUD:30..140 degrees. Menu:30..100 degrees. Larger fills more view.
HUDWidthDegrees=100
MenuWidthDegrees=60
HUDDistanceMeters=2
MenuDistanceMeters=2
; Binocular convergence distance, accepted range0.5..10 metres.
DistanceMeters=2

[Lighting]
; Fix the native AA-off lighting grid overflow at large render sizes. F1 compares.
FixAAOffGrid=1
FixAAOffTileRays=1

[FirstPerson]
; Pause toggles first person. F9 recenters. Close Unity normally to end the session.
Enabled=1
HideBody=1
; Metres: vertical adjustment and displacement along mouse-camera heading.
HeightOffset=0
ForwardOffset=0

[Effects]
; Remove the headset-identified volumetric fog composite. 0 restores native fog.
; NumPad8 compares only this effect; normal shadows are preserved.
RemoveVolumetricFog=1
; Hide the headset-tested distant tree billboard families. 0 keeps them visible.
; Read at startup. NumPad1 compares removal ON/OFF during this diagnostic.
RemoveTreeBillboards=1
; Hide both identified chimney smoke families; 0 restores native smoke.
; Read at startup. NumPad4 compares combined removal ON/OFF.
RemoveChimneySmoke=1

[Diagnostics]
; Heavy draw-input/depth capture is opt-in; normal F8 screenshots still work.
CaptureEffectInputs=0
; Exact headset-marked crowd CPU trace, F8 only.
CaptureMarkedCrowd=0
; GPU profiling is optional and starts OFF; F3 toggles it.
; Detailed draw queries stay OFF except an explicitly requested F8 capture.
GpuProfiling=0
GpuDetailed=0

[Performance]
; Exact guarded native caller-frame lookup; bounded stack walk stays as fallback.
FastBatchLookup=1
; Known installed dispatch targets avoid repeated memory-region queries.
FastDispatchCheck=1
; NumPad5 compares these CPU paths together; it does not change rendering.


[Culling]
; Retired final-render and global-getter experiments remain disabled.
; NumPad9 compares temporary native group/individual visibility camera input.
BulkHeadCamera=0
BulkHeadCameraCompare=0
EarlyCrowdCamera=0
DenseVisibilityCamera=1

; Failed r26 submission experiment disabled.
StationaryCrowdSubmission=0
; Supply the head pose to the actual gameplay camera after its native update.
; Starts ON; no new comparison hotkey. Restart after changing this setting.
GameplayHeadCamera=1

